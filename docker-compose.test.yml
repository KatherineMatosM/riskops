# Isolated disposable system tests. Never mount the application's data volume.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RiskOps-ci!2026-Only"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    image: riskops-ci-backend
    build:
      context: ./backend
    environment:
      APP_ENV: ci
      JWT_SECRET_KEY: riskops-isolated-ci-token-key
      SECRET_KEY: riskops-isolated-ci-secret-key
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: riskops_ci
      DB_USER: sa
      DB_PASSWORD: "RiskOps-ci!2026-Only"
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: "RiskOps-CI-admin!2026"
      ADMIN_FULL_NAME: Administrador de pruebas
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: http://localhost:13000
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: riskops-ci-frontend
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api/v1
    ports:
      - "127.0.0.1:13000:80"
    depends_on:
      backend:
        condition: service_healthy
