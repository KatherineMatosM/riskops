name: System Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:

permissions:
  contents: read

concurrency:
  group: system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and start isolated system
        run: docker compose -p riskops-ci -f docker-compose.test.yml up --build -d --wait --wait-timeout 180

      - name: Migrate and seed the empty SQL Server database
        run: docker compose -p riskops-ci -f docker-compose.test.yml exec -T backend python -m app.database.bootstrap

      - name: Check bootstrap is repeatable
        run: docker compose -p riskops-ci -f docker-compose.test.yml exec -T backend python -m app.database.bootstrap

      - name: Verify application flows
        run: node scripts/smoke-system.cjs
        env:
          SMOKE_ALLOW_WRITES: "true"
          SMOKE_API_URL: http://127.0.0.1:18000/api/v1
          SMOKE_WEB_URL: http://127.0.0.1:13000

      - name: Verify browser flows
        run: node scripts/smoke-browser.cjs
        env:
          SMOKE_ALLOW_WRITES: "true"
          SMOKE_API_URL: http://127.0.0.1:18000/api/v1
          SMOKE_WEB_URL: http://127.0.0.1:13000

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p riskops-ci -f docker-compose.test.yml logs --no-color --tail 100

      - name: Remove disposable containers
        if: always()
        run: docker compose -p riskops-ci -f docker-compose.test.yml down --volumes --remove-orphans
